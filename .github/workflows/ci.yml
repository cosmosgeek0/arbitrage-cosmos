name: CI

on:
  push:
    branches: [current-main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-full:
    name: Canonical full matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Provenance and Product Assurance verify reachable historical donor
          # objects. The default depth of one cannot supply that evidence.
          fetch-depth: 0

      - name: Use pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned Python
        uses: actions/setup-python@v6
        with:
          python-version-file: quant/.python-version

      - name: Use pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.28
          enable-cache: true
          cache-dependency-glob: quant/uv.lock

      - name: Install locked dependencies
        run: npm ci

      - name: Synchronize complete locked Quant environment
        run: uv sync --project quant --locked --all-groups --all-extras --python 3.13.14

      - name: Run canonical full matrix
        run: npm run test:all

  ops-local:
    name: Bounded local operations proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Mirror production fixed interpreter
        # The I00 fixed-interpreter control requires a real, root-owned,
        # non-symlink /usr/bin/node. The deployment target satisfies it
        # (measured: root:root 0755, v22.23.1); hosted runners place Node in
        # the tool cache instead. Copy — never symlink, the guard rejects
        # links — so the control's preconditions exist and the control can be
        # exercised. This provisions the environment; it does not relax a check.
        run: |
          set -euo pipefail
          node_path="$(command -v node)"
          test -n "$node_path"
          sudo cp -f "$node_path" /usr/bin/node
          sudo chown root:root /usr/bin/node
          sudo chmod 0755 /usr/bin/node
          test -f /usr/bin/node && test ! -L /usr/bin/node && test -x /usr/bin/node
          /usr/bin/node --version

      - name: Normalize workspace permissions to production shape
        # The path-permission rule inspects an executable's FULL ancestor chain.
        # On the deployment target the installed tree is root-owned and the
        # chain is clean, so the rule never fires there. A hosted runner can
        # carry a permissive bit higher up the chain than the workspace, and
        # suites also stage fixture programs under the runner temp root, which
        # is outside the workspace entirely - so normalizing only downward from
        # the workspace could never reach either subject. Normalize the whole
        # runner chain and the temp root as well.
        run: |
          set -uo pipefail
          for d in /home/runner /home/runner/work "$GITHUB_WORKSPACE" "${RUNNER_TEMP:-}" "${TMPDIR:-}"; do
            [ -n "$d" ] && [ -d "$d" ] && chmod go-w "$d" || true
          done
          chmod -R go-w "$GITHUB_WORKSPACE" || true
          for p in / /home /home/runner /home/runner/work "$GITHUB_WORKSPACE" "${RUNNER_TEMP:-/tmp}"; do
            [ -n "$p" ] && [ -e "$p" ] && stat -c '%n %U:%G %a' "$p" || true
          done

      - name: Run generic local operations proofs
        run: bash ops/tests/run-all.sh

      - name: Run I00 local operations proofs
        run: bash ops/tests/i00/run-all.sh
